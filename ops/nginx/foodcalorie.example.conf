# 食刻（FoodCalorie）生产 nginx server 块模板（脱敏，供重建/审计）
# 使用前替换占位符：<DOMAIN> / <TLS_CERT_PATH> / <TLS_KEY_PATH>
# 校验：nginx -t -c /etc/nginx/nginx.conf && nginx -s reload
#
# 安全要点（与代码约定一致）：
# 1. /uploads/ 一律 404 —— 图片只能经鉴权 API /api/v1/foodcalorie/ai/images/:filename 读取，
#    严禁 alias 暴露上传目录（否则私有食物照片公网可读）。
# 2. 后端仅监听 127.0.0.1:3001，本 server 块为其唯一对外入口。
# 3. CORS 白名单由应用层强制（CORS_ORIGINS fail-closed），nginx 不做反射。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMAIN>;

    # ── TLS（占位，按实际证书替换；建议 Let's Encrypt + 自动续期）──
    ssl_certificate     <TLS_CERT_PATH>;
    ssl_certificate_key <TLS_KEY_PATH>;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全头 ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 基础调优 ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    client_max_body_size 11m;   # 应用层上传上限 10MB + multipart 开销

    # ── 前端静态资源（SPA，base './'，无子路径）──
    root /var/www/foodcalorie-web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 业务 API 反代 → 本机 PM2 :3001 ──
    location /api/v1/foodcalorie/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;   # AI 识别最长 15s + 余量
    }

    # 认证接口（gakiwoo-api，如与本站同机反代；否则由 gakiwoo 主站处理）
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 私有上传目录：硬性 404（应用层鉴权读取，见 ops/nginx/private-uploads.conf）──
    location ^~ /uploads/ {
        return 404;
    }

    # ── 可选：nginx 层基础限流兜底（应用层已有限流，此为纵深防御）──
    # limit_req_zone $binary_remote_addr zone=fc_api:10m rate=10r/s;
    # location /api/ {
    #     limit_req zone=fc_api burst=20 nodelay;
    #     proxy_pass http://127.0.0.1:3001;
    # }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;
    return 301 https://$host$request_uri;
}

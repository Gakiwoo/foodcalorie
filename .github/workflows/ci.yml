name: CI

on:
  pull_request:
  schedule:
    - cron: '17 2 * * 1' # 每周回归，及时发现日期边界与依赖安全漂移
  push:
    branches: [main]
    tags: ['v*'] # tag 触发 android-release（签名 APK → GitHub Releases）

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
      - run: node scripts/check-secrets.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  android-debug:
    runs-on: ubuntu-latest
    # artifact 上传需要 actions: write（顶层 permissions 只声明了 contents: read）
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: node ../scripts/verify-release-version.mjs
      - run: VITE_API_ORIGIN=https://foodcalorie.gakiwoo.com npm run build:apk
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foodcalorie-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # 发布签名 APK：推 tag（v*）时触发；未配置 FC_RELEASE_* Secrets 时
  # 第一步即跳过（注意：if 条件不能直接访问 secrets 上下文，须经 env 映射）。
  # 需要的 Secrets：
  #   FC_KEYSTORE_BASE64        keystore 文件 base64（生成：base64 -w0 fc-release.keystore）
  #   FC_RELEASE_STORE_PASSWORD keystore 口令
  #   FC_RELEASE_KEY_ALIAS      别名
  #   FC_RELEASE_KEY_PASSWORD   密钥口令
  android-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 与上传附件
    env:
      HAS_RELEASE_SECRETS: ${{ secrets.FC_RELEASE_STORE_PASSWORD != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Skip when release secrets missing
        if: env.HAS_RELEASE_SECRETS == 'false'
        # 覆盖 job 级 defaults（frontend/）：此分支下 checkout 被门控未执行，
        # frontend/ 目录不存在，bash 会因 cwd 不存在启动失败（v1.0.5 实测踩中）
        working-directory: .
        run: echo "FC_RELEASE_* Secrets 未配置，跳过签名发布"; exit 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: env.HAS_RELEASE_SECRETS == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: env.HAS_RELEASE_SECRETS == 'true'
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: env.HAS_RELEASE_SECRETS == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
        if: env.HAS_RELEASE_SECRETS == 'true'
      - run: node ../scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"
        if: env.HAS_RELEASE_SECRETS == 'true'
      - name: Write release keystore from secrets
        if: env.HAS_RELEASE_SECRETS == 'true'
        run: |
          echo "${{ secrets.FC_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/fc-release.keystore"
          echo "FC_RELEASE_STORE_FILE=$RUNNER_TEMP/fc-release.keystore" >> "$GITHUB_ENV"
          echo "FC_RELEASE_STORE_PASSWORD=${{ secrets.FC_RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "FC_RELEASE_KEY_ALIAS=${{ secrets.FC_RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "FC_RELEASE_KEY_PASSWORD=${{ secrets.FC_RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - run: VITE_API_ORIGIN=https://foodcalorie.gakiwoo.com npm run build:apk
        if: env.HAS_RELEASE_SECRETS == 'true'
      - run: npx cap sync android
        if: env.HAS_RELEASE_SECRETS == 'true'
      - run: ./gradlew assembleRelease --no-daemon
        if: env.HAS_RELEASE_SECRETS == 'true'
        working-directory: frontend/android
      - name: Verify and name signed APK
        if: env.HAS_RELEASE_SECRETS == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          SOURCE_APK=frontend/android/app/build/outputs/apk/release/app-release.apk
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$SOURCE_APK")
          test "$VERSION_CODE" -gt 0
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$SOURCE_APK")" = "com.shike.app"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$SOURCE_APK")" = "$EXPECTED_VERSION"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$SOURCE_APK" | grep -F "application-label:'食刻'"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SOURCE_APK"
          RELEASE_DIR=frontend/android/app/build/outputs/apk/release
          RELEASE_FILE="FoodCalorie-${GITHUB_REF_NAME}-code${VERSION_CODE}-release.apk"
          RELEASE_APK="$RELEASE_DIR/$RELEASE_FILE"
          cp "$SOURCE_APK" "$RELEASE_APK"
          (cd "$RELEASE_DIR" && sha256sum "$RELEASE_FILE" > "${RELEASE_FILE}.sha256")
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
      - name: Upload signed APK to GitHub Release
        if: env.HAS_RELEASE_SECRETS == 'true'
        # 覆盖 job 级 defaults（frontend/）：APK 路径以仓库根为基准，
        # 否则解析成 frontend/frontend/... 导致 glob 无匹配（v1.0.6 首发实测踩中）
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            "$RELEASE_APK" "${RELEASE_APK}.sha256" \
            --clobber

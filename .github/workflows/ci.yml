name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
      - run: node scripts/check-secrets.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  android-debug:
    runs-on: ubuntu-latest
    # artifact 上传需要 actions: write（顶层 permissions 只声明了 contents: read）
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: VITE_API_ORIGIN=https://foodcalorie.gakiwoo.com npm run build:apk
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foodcalorie-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # 发布签名 APK：推 tag（v*）且已配置 release 密钥时触发；
  # 未配置 FC_RELEASE_* Secrets 时自动跳过（不影响现有 debug 流程）。
  # 需要的 Secrets：
  #   FC_KEYSTORE_BASE64        keystore 文件 base64（生成：base64 -w0 fc-release.keystore）
  #   FC_RELEASE_STORE_PASSWORD keystore 口令
  #   FC_RELEASE_KEY_ALIAS      别名
  #   FC_RELEASE_KEY_PASSWORD   密钥口令
  android-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.FC_RELEASE_STORE_PASSWORD != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 与上传附件
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Write release keystore from secrets
        run: |
          echo "${{ secrets.FC_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/fc-release.keystore"
          echo "FC_RELEASE_STORE_FILE=$RUNNER_TEMP/fc-release.keystore" >> "$GITHUB_ENV"
          echo "FC_RELEASE_STORE_PASSWORD=${{ secrets.FC_RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "FC_RELEASE_KEY_ALIAS=${{ secrets.FC_RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "FC_RELEASE_KEY_PASSWORD=${{ secrets.FC_RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - run: VITE_API_ORIGIN=https://foodcalorie.gakiwoo.com npm run build:apk
      - run: npx cap sync android
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: frontend/android
      - name: Upload signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            --clobber

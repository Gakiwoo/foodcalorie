<main data-name='FoodCalorie-Profile' class='flex flex-col justify-start items-stretch w-[375px] min-h-[812px] bg-[#F7F8FA]'>
  <div data-name='status-bar' class='flex flex-row justify-between items-center w-[375px] px-[20px] pt-[12px] pb-[8px]'>
    <span data-name='status-time' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>9:41</span>
    <div data-name='status-icons' class='flex flex-row justify-end items-center gap-[6px]'>
      <i data-name='icon-signal' class='fas fa-signal text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-wifi' class='fas fa-wifi text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-battery' class='fas fa-battery-full text-[14px] text-[#1A1A1A]'></i>
    </div>
  </div>
  <div data-name='top-nav' class='flex flex-row justify-between items-center w-[375px] px-[20px] py-[10px]'>
    <i data-name='nav-back' class='fas fa-chevron-left text-[22px] text-[#1A1A1A] shrink-0'></i>
    <span data-name='nav-title' class='flex-1 text-[18px] leading-[24px] font-[700] text-[#1A1A1A] text-center'>个人信息</span>
    <span data-name='nav-save' class='text-[15px] leading-[20px] font-[600] text-[#34C759] shrink-0'>保存</span>
  </div>
  <div data-name='avatar-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[8px]'>
    <div data-name='avatar-card' class='flex flex-col justify-center items-center w-[335px] px-[20px] py-[24px] bg-[#FFFFFF] rounded-[20px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)] gap-[12px]'>
      <div data-name='avatar-wrap' class='flex flex-row justify-center items-center w-[88px] h-[88px] rounded-[44px] bg-[linear-gradient(135deg,#34C759_0%,#22A85A_100%)]'>
        <i data-name='avatar-icon' class='fas fa-user text-[40px] text-[#FFFFFF]'></i>
      </div>
      <div data-name='avatar-edit' class='flex flex-row justify-center items-center px-[14px] h-[30px] rounded-[15px] bg-[#E8F5EC]'>
        <i data-name='avatar-edit-icon' class='fas fa-camera text-[12px] text-[#22A85A] mr-[6px]'></i>
        <span data-name='avatar-edit-text' class='text-[13px] leading-[18px] font-[600] text-[#22A85A] text-center'>更换头像</span>
      </div>
    </div>
  </div>
  <div data-name='info-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[8px]'>
    <div data-name='info-card' class='flex flex-col justify-start items-stretch w-[335px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)]'>
      <div data-name='row-nickname' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='row-nickname-label' class='text-[14px] leading-[20px] font-[500] text-[#1A1A1A] text-left'>昵称</span>
        <div data-name='row-nickname-value' class='flex flex-row justify-end items-center gap-[6px]'>
          <span data-name='row-nickname-text' class='text-[14px] leading-[20px] font-[400] text-[#9CA3AF] text-right'>健康生活家</span>
          <i data-name='row-nickname-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC]'></i>
        </div>
      </div>
      <div data-name='info-divider-1' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='row-gender' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='row-gender-label' class='text-[14px] leading-[20px] font-[500] text-[#1A1A1A] text-left'>性别</span>
        <div data-name='row-gender-value' class='flex flex-row justify-end items-center gap-[6px]'>
          <span data-name='row-gender-text' class='text-[14px] leading-[20px] font-[400] text-[#9CA3AF] text-right'>女</span>
          <i data-name='row-gender-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC]'></i>
        </div>
      </div>
      <div data-name='info-divider-2' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='row-birth' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='row-birth-label' class='text-[14px] leading-[20px] font-[500] text-[#1A1A1A] text-left'>生日</span>
        <div data-name='row-birth-value' class='flex flex-row justify-end items-center gap-[6px]'>
          <span data-name='row-birth-text' class='text-[14px] leading-[20px] font-[400] text-[#9CA3AF] text-right'>1998-05-20</span>
          <i data-name='row-birth-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC]'></i>
        </div>
      </div>
      <div data-name='info-divider-3' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='row-height' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='row-height-label' class='text-[14px] leading-[20px] font-[500] text-[#1A1A1A] text-left'>身高</span>
        <div data-name='row-height-value' class='flex flex-row justify-end items-center gap-[6px]'>
          <span data-name='row-height-text' class='text-[14px] leading-[20px] font-[400] text-[#9CA3AF] text-right'>165 cm</span>
          <i data-name='row-height-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC]'></i>
        </div>
      </div>
      <div data-name='info-divider-4' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='row-weight' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='row-weight-label' class='text-[14px] leading-[20px] font-[500] text-[#1A1A1A] text-left'>体重</span>
        <div data-name='row-weight-value' class='flex flex-row justify-end items-center gap-[6px]'>
          <span data-name='row-weight-text' class='text-[14px] leading-[20px] font-[400] text-[#9CA3AF] text-right'>55 kg</span>
          <i data-name='row-weight-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC]'></i>
        </div>
      </div>
      <div data-name='info-divider-5' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='row-goal' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='row-goal-label' class='text-[14px] leading-[20px] font-[500] text-[#1A1A1A] text-left'>健康目标</span>
        <div data-name='row-goal-value' class='flex flex-row justify-end items-center gap-[6px]'>
          <span data-name='row-goal-text' class='text-[14px] leading-[20px] font-[400] text-[#9CA3AF] text-right'>减脂</span>
          <i data-name='row-goal-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC]'></i>
        </div>
      </div>
    </div>
  </div>
  <div data-name='save-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[12px] pb-[24px]'>
    <div data-name='save-btn' class='flex flex-row justify-center items-center w-[335px] h-[48px] rounded-[16px] bg-[#34C759]'>
      <span data-name='save-btn-text' class='text-[16px] leading-[22px] font-[700] text-[#FFFFFF] text-center'>保存修改</span>
    </div>
  </div>
</main>

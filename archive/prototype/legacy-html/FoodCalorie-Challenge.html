<main data-name='FoodCalorie-Challenge' class='flex flex-col justify-start items-stretch w-[375px] min-h-[812px] bg-[#F7F8FA]'>
  <div data-name='status-bar' class='flex flex-row justify-between items-center w-[375px] px-[20px] pt-[12px] pb-[8px]'>
    <span data-name='status-time' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>9:41</span>
    <div data-name='status-icons' class='flex flex-row justify-end items-center gap-[6px]'>
      <i data-name='icon-signal' class='fas fa-signal text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-wifi' class='fas fa-wifi text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-battery' class='fas fa-battery-full text-[14px] text-[#1A1A1A]'></i>
    </div>
  </div>
  <div data-name='top-nav' class='flex flex-row justify-between items-center w-[375px] px-[20px] py-[10px]'>
    <i data-name='nav-back' class='fas fa-chevron-left text-[22px] text-[#1A1A1A] shrink-0'></i>
    <span data-name='nav-title' class='flex-1 text-[18px] leading-[24px] font-[700] text-[#1A1A1A] text-center'>夏季轻食挑战</span>
    <i data-name='nav-share' class='fas fa-share-nodes text-[18px] text-[#1A1A1A] shrink-0'></i>
  </div>
  <div data-name='banner-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='banner-card' class='flex flex-row justify-between items-center w-[335px] h-[150px] px-[20px] bg-[linear-gradient(135deg,#34C759_0%,#1FA355_100%)] rounded-[20px]'>
      <div data-name='banner-left' class='flex flex-col justify-center items-start gap-[6px]'>
        <span data-name='banner-tag' class='text-[11px] leading-[15px] font-[600] text-[rgba(255,255,255,0.9)] text-left'>21 天打卡计划</span>
        <span data-name='banner-title' class='text-[22px] leading-[28px] font-[700] text-[#FFFFFF] text-left'>夏季轻食挑战</span>
        <span data-name='banner-desc' class='text-[12px] leading-[16px] font-[400] text-[rgba(255,255,255,0.85)] text-left'>健康饮食 21 天，赢专属徽章</span>
      </div>
      <i data-name='banner-icon' class='fas fa-medal text-[56px] text-[rgba(255,255,255,0.9)] shrink-0'></i>
    </div>
  </div>
  <div data-name='info-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[8px]'>
    <div data-name='info-card' class='flex flex-row justify-between items-center w-[335px] px-[18px] py-[16px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)]'>
      <div data-name='info-1' class='flex flex-col justify-center items-center gap-[4px]'>
        <span data-name='info-1-val' class='text-[18px] leading-[22px] font-[700] text-[#1A1A1A] text-center'>7.15-8.4</span>
        <span data-name='info-1-label' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-center'>活动时间</span>
      </div>
      <div data-name='info-divider-1' class='w-[1px] h-[32px] bg-[#EEF0F2]'></div>
      <div data-name='info-2' class='flex flex-col justify-center items-center gap-[4px]'>
        <span data-name='info-2-val' class='text-[18px] leading-[22px] font-[700] text-[#34C759] text-center'>12,800</span>
        <span data-name='info-2-label' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-center'>参与人数</span>
      </div>
      <div data-name='info-divider-2' class='w-[1px] h-[32px] bg-[#EEF0F2]'></div>
      <div data-name='info-3' class='flex flex-col justify-center items-center gap-[4px]'>
        <span data-name='info-3-val' class='text-[18px] leading-[22px] font-[700] text-[#1A1A1A] text-center'>3,200</span>
        <span data-name='info-3-label' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-center'>已完成</span>
      </div>
    </div>
  </div>
  <div data-name='task-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='task-card' class='flex flex-col justify-start items-stretch w-[335px] px-[16px] py-[16px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)] gap-[14px]'>
      <span data-name='task-title' class='text-[15px] leading-[20px] font-[700] text-[#1A1A1A] text-left'>我的任务</span>
      <div data-name='task-1' class='flex flex-row justify-start items-center gap-[10px]'>
        <div data-name='task-1-check' class='flex flex-row justify-center items-center w-[22px] h-[22px] rounded-[11px] bg-[#34C759] shrink-0'>
          <i data-name='task-1-check-icon' class='fas fa-check text-[11px] text-[#FFFFFF]'></i>
        </div>
        <div data-name='task-1-info' class='flex flex-col justify-center items-start flex-1 gap-[2px]'>
          <span data-name='task-1-name' class='text-[14px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>每日拍照记录一餐</span>
          <span data-name='task-1-status' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>已完成 6/21 天</span>
        </div>
        <span data-name='task-1-badge' class='text-[11px] leading-[15px] font-[600] text-[#22A85A] text-right shrink-0'>+10 积分</span>
      </div>
      <div data-name='task-divider-1' class='w-[303px] h-[1px] bg-[#EEF0F2]'></div>
      <div data-name='task-2' class='flex flex-row justify-start items-center gap-[10px]'>
        <div data-name='task-2-check' class='flex flex-row justify-center items-center w-[22px] h-[22px] rounded-[11px] bg-[#E8F5EC] shrink-0'>
          <i data-name='task-2-check-icon' class='fas fa-check text-[11px] text-[#22A85A]'></i>
        </div>
        <div data-name='task-2-info' class='flex flex-col justify-center items-start flex-1 gap-[2px]'>
          <span data-name='task-2-name' class='text-[14px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>连续 7 天不超标</span>
          <span data-name='task-2-status' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>已连续 5 天</span>
        </div>
        <span data-name='task-2-badge' class='text-[11px] leading-[15px] font-[600] text-[#22A85A] text-right shrink-0'>+30 积分</span>
      </div>
      <div data-name='task-divider-2' class='w-[303px] h-[1px] bg-[#EEF0F2]'></div>
      <div data-name='task-3' class='flex flex-row justify-start items-center gap-[10px]'>
        <div data-name='task-3-check' class='flex flex-row justify-center items-center w-[22px] h-[22px] rounded-[11px] bg-[#F7F8FA] shrink-0'>
          <i data-name='task-3-check-icon' class='fas fa-circle text-[8px] text-[#D9DEE3]'></i>
        </div>
        <div data-name='task-3-info' class='flex flex-col justify-center items-start flex-1 gap-[2px]'>
          <span data-name='task-3-name' class='text-[14px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>分享 3 道轻食食谱</span>
          <span data-name='task-3-status' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>已完成 1/3</span>
        </div>
        <span data-name='task-3-badge' class='text-[11px] leading-[15px] font-[600] text-[#22A85A] text-right shrink-0'>+50 积分</span>
      </div>
    </div>
  </div>
  <div data-name='progress-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='progress-card' class='flex flex-col justify-start items-stretch w-[335px] px-[16px] py-[16px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)] gap-[10px]'>
      <div data-name='progress-header' class='flex flex-row justify-between items-center'>
        <span data-name='progress-title' class='text-[15px] leading-[20px] font-[700] text-[#1A1A1A] text-left'>打卡进度</span>
        <span data-name='progress-value' class='text-[13px] leading-[18px] font-[600] text-[#34C759] text-right'>6 / 21 天</span>
      </div>
      <div data-name='progress-bar' class='flex flex-row justify-start items-center w-[303px] h-[10px] rounded-[5px] bg-[#F7F8FA] overflow-hidden'>
        <div data-name='progress-bar-fill' class='flex flex-row justify-start items-center h-[10px] w-[29%] rounded-[5px] bg-[#34C759]'></div>
      </div>
      <span data-name='progress-note' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>再坚持 15 天即可获得「轻食达人」徽章</span>
    </div>
  </div>
  <div data-name='action-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[24px]'>
    <div data-name='join-btn' class='flex flex-row justify-center items-center w-[335px] h-[48px] rounded-[16px] bg-[#34C759]'>
      <i data-name='join-btn-icon' class='fas fa-trophy text-[16px] text-[#FFFFFF] mr-[8px]'></i>
      <span data-name='join-btn-text' class='text-[16px] leading-[22px] font-[700] text-[#FFFFFF] text-center'>立即参与挑战</span>
    </div>
  </div>
</main>

<main data-name='FoodCalorie-Register' class='flex flex-col justify-start items-stretch w-[375px] min-h-[812px] bg-[#F7F8FA]'>
  <div data-name='status-bar' class='flex flex-row justify-between items-center w-[375px] px-[20px] pt-[12px] pb-[8px]'>
    <span data-name='status-time' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>9:41</span>
    <div data-name='status-icons' class='flex flex-row justify-end items-center gap-[6px]'>
      <i data-name='icon-signal' class='fas fa-signal text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-wifi' class='fas fa-wifi text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-battery' class='fas fa-battery-full text-[14px] text-[#1A1A1A]'></i>
    </div>
  </div>
  <div data-name='top-nav' class='flex flex-row justify-between items-center w-[375px] px-[20px] py-[10px]'>
    <i data-name='nav-back' class='fas fa-chevron-left text-[22px] text-[#1A1A1A] shrink-0'></i>
    <span data-name='nav-title' class='flex-1 text-[18px] leading-[24px] font-[700] text-[#1A1A1A] text-center'>注册账号</span>
    <div data-name='nav-spacer' class='w-[22px] shrink-0'></div>
  </div>
  <div data-name='logo-section' class='flex flex-col justify-center items-center w-[375px] pt-[16px] pb-[16px] gap-[6px]'>
    <div data-name='logo-circle' class='flex flex-row justify-center items-center w-[64px] h-[64px] rounded-[32px] bg-[linear-gradient(135deg,#34C759_0%,#22A85A_100%)]'>
      <i data-name='logo-icon' class='fas fa-utensils text-[28px] text-[#FFFFFF]'></i>
    </div>
    <span data-name='logo-sub' class='text-[12px] leading-[16px] font-[400] text-[#9CA3AF] text-center'>注册食刻账号，开启健康记录</span>
  </div>
  <div data-name='form-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px] gap-[12px]'>
    <div data-name='email-row' class='flex flex-row justify-start items-center gap-[10px] w-[335px] h-[50px] px-[14px] bg-[#FFFFFF] rounded-[14px] shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)]'>
      <i data-name='email-icon' class='fas fa-envelope text-[14px] text-[#9CA3AF] shrink-0'></i>
      <span data-name='email-placeholder' class='flex-1 text-[15px] leading-[20px] font-[400] text-[#C0C4CC] text-left'>请输入邮箱地址</span>
    </div>
    <div data-name='password-row' class='flex flex-row justify-start items-center gap-[10px] w-[335px] h-[50px] px-[14px] bg-[#FFFFFF] rounded-[14px] shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)]'>
      <i data-name='password-icon' class='fas fa-lock text-[14px] text-[#9CA3AF] shrink-0'></i>
      <span data-name='password-placeholder' class='flex-1 text-[15px] leading-[20px] font-[400] text-[#C0C4CC] text-left'>设置密码（6-20 位字母数字）</span>
      <i data-name='password-eye' class='fas fa-eye text-[14px] text-[#C0C4CC] shrink-0'></i>
    </div>
    <div data-name='confirm-row' class='flex flex-row justify-start items-center gap-[10px] w-[335px] h-[50px] px-[14px] bg-[#FFFFFF] rounded-[14px] shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)]'>
      <i data-name='confirm-icon' class='fas fa-lock text-[14px] text-[#9CA3AF] shrink-0'></i>
      <span data-name='confirm-placeholder' class='flex-1 text-[15px] leading-[20px] font-[400] text-[#C0C4CC] text-left'>再次输入密码</span>
    </div>
  </div>
  <div data-name='register-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[16px] pb-[8px]'>
    <div data-name='register-btn' class='flex flex-row justify-center items-center w-[335px] h-[50px] rounded-[16px] bg-[#34C759]'>
      <span data-name='register-btn-text' class='text-[16px] leading-[22px] font-[700] text-[#FFFFFF] text-center'>注册并登录</span>
    </div>
  </div>
  <div data-name='agreement-section' class='flex flex-row justify-center items-center w-[375px] px-[20px] pt-[10px] pb-[8px] gap-[6px]'>
    <div data-name='agree-check' class='flex flex-row justify-center items-center w-[16px] h-[16px] rounded-[8px] bg-[#34C759]'>
      <i data-name='agree-check-icon' class='fas fa-check text-[9px] text-[#FFFFFF]'></i>
    </div>
    <p data-name='agree-text' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>我已阅读并同意</p>
    <span data-name='agree-protocol' class='text-[11px] leading-[15px] font-[500] text-[#22A85A] text-left shrink-0'>《用户协议》</span>
    <span data-name='agree-policy' class='text-[11px] leading-[15px] font-[500] text-[#22A85A] text-left shrink-0'>《隐私政策》</span>
  </div>
  <div data-name='login-section' class='flex flex-row justify-center items-center w-[375px] px-[20px] pt-[6px] pb-[24px] gap-[4px]'>
    <span data-name='login-hint' class='text-[13px] leading-[18px] font-[400] text-[#9CA3AF] text-center'>已有账号？</span>
    <span data-name='to-login' class='text-[13px] leading-[18px] font-[700] text-[#34C759] text-center'>去登录</span>
  </div>
</main>

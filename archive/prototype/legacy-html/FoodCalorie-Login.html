<main data-name='FoodCalorie-Login' class='flex flex-col justify-start items-stretch w-[375px] min-h-[812px] bg-[#F7F8FA]'>
  <div data-name='status-bar' class='flex flex-row justify-between items-center w-[375px] px-[20px] pt-[12px] pb-[8px]'>
    <span data-name='status-time' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>9:41</span>
    <div data-name='status-icons' class='flex flex-row justify-end items-center gap-[6px]'>
      <i data-name='icon-signal' class='fas fa-signal text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-wifi' class='fas fa-wifi text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-battery' class='fas fa-battery-full text-[14px] text-[#1A1A1A]'></i>
    </div>
  </div>
  <div data-name='logo-section' class='flex flex-col justify-center items-center w-[375px] pt-[28px] pb-[20px] gap-[10px]'>
    <div data-name='logo-circle' class='flex flex-row justify-center items-center w-[88px] h-[88px] rounded-[44px] bg-[linear-gradient(135deg,#34C759_0%,#22A85A_100%)]'>
      <i data-name='logo-icon' class='fas fa-utensils text-[40px] text-[#FFFFFF]'></i>
    </div>
    <p data-name='app-name' class='text-[26px] leading-[32px] font-[700] text-[#1A1A1A] text-center'>食刻</p>
    <span data-name='app-slogan' class='text-[13px] leading-[18px] font-[400] text-[#9CA3AF] text-center'>记录每一餐，健康每一天</span>
  </div>
  <div data-name='form-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px] gap-[12px]'>
    <div data-name='email-row' class='flex flex-row justify-start items-center gap-[10px] w-[335px] h-[50px] px-[14px] bg-[#FFFFFF] rounded-[14px] shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)]'>
      <i data-name='email-icon' class='fas fa-envelope text-[14px] text-[#9CA3AF] shrink-0'></i>
      <span data-name='email-placeholder' class='flex-1 text-[15px] leading-[20px] font-[400] text-[#C0C4CC] text-left'>请输入邮箱地址</span>
    </div>
    <div data-name='password-row' class='flex flex-row justify-start items-center gap-[10px] w-[335px] h-[50px] px-[14px] bg-[#FFFFFF] rounded-[14px] shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)]'>
      <i data-name='password-icon' class='fas fa-lock text-[14px] text-[#9CA3AF] shrink-0'></i>
      <span data-name='password-placeholder' class='flex-1 text-[15px] leading-[20px] font-[400] text-[#C0C4CC] text-left'>请输入密码</span>
      <i data-name='password-eye' class='fas fa-eye text-[14px] text-[#C0C4CC] shrink-0'></i>
    </div>
    <div data-name='forgot-row' class='flex flex-row justify-end items-center w-[335px]'>
      <span data-name='forgot-password' class='text-[12px] leading-[16px] font-[500] text-[#22A85A] text-right'>忘记密码？</span>
    </div>
  </div>
  <div data-name='login-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[8px]'>
    <div data-name='login-btn' class='flex flex-row justify-center items-center w-[335px] h-[50px] rounded-[16px] bg-[#34C759]'>
      <span data-name='login-btn-text' class='text-[16px] leading-[22px] font-[700] text-[#FFFFFF] text-center'>登 录</span>
    </div>
  </div>
  <div data-name='divider-section' class='flex flex-row justify-center items-center w-[375px] px-[20px] pt-[12px] pb-[8px] gap-[12px]'>
    <div data-name='divider-line-1' class='flex-1 h-[1px] bg-[#EEF0F2]'></div>
    <span data-name='divider-text' class='text-[12px] leading-[16px] font-[400] text-[#C0C4CC] text-center'>或</span>
    <div data-name='divider-line-2' class='flex-1 h-[1px] bg-[#EEF0F2]'></div>
  </div>
  <div data-name='wechat-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='wechat-btn' class='flex flex-row justify-center items-center w-[335px] h-[48px] rounded-[16px] bg-[#FFFFFF] border-[1.5px] border-[#E5E7EB] gap-[8px]'>
      <i data-name='wechat-icon' class='fab fa-weixin text-[20px] text-[#34C759]'></i>
      <span data-name='wechat-text' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-center'>微信一键登录</span>
    </div>
  </div>
  <div data-name='agreement-section' class='flex flex-row justify-center items-center w-[375px] px-[20px] pt-[10px] pb-[8px] gap-[6px]'>
    <div data-name='agree-check' class='flex flex-row justify-center items-center w-[16px] h-[16px] rounded-[8px] bg-[#34C759]'>
      <i data-name='agree-check-icon' class='fas fa-check text-[9px] text-[#FFFFFF]'></i>
    </div>
    <p data-name='agree-text' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>我已阅读并同意</p>
    <span data-name='agree-protocol' class='text-[11px] leading-[15px] font-[500] text-[#22A85A] text-left shrink-0'>《用户协议》</span>
    <span data-name='agree-policy' class='text-[11px] leading-[15px] font-[500] text-[#22A85A] text-left shrink-0'>《隐私政策》</span>
  </div>
  <div data-name='register-section' class='flex flex-row justify-center items-center w-[375px] px-[20px] pt-[6px] pb-[24px] gap-[4px]'>
    <span data-name='register-hint' class='text-[13px] leading-[18px] font-[400] text-[#9CA3AF] text-center'>还没有账号？</span>
    <span data-name='to-register' class='text-[13px] leading-[18px] font-[700] text-[#34C759] text-center'>立即注册</span>
  </div>
</main>

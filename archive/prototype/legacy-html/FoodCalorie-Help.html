<main data-name='FoodCalorie-Help' class='flex flex-col justify-start items-stretch w-[375px] min-h-[812px] bg-[#F7F8FA]'>
  <div data-name='status-bar' class='flex flex-row justify-between items-center w-[375px] px-[20px] pt-[12px] pb-[8px]'>
    <span data-name='status-time' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>9:41</span>
    <div data-name='status-icons' class='flex flex-row justify-end items-center gap-[6px]'>
      <i data-name='icon-signal' class='fas fa-signal text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-wifi' class='fas fa-wifi text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-battery' class='fas fa-battery-full text-[14px] text-[#1A1A1A]'></i>
    </div>
  </div>
  <div data-name='top-nav' class='flex flex-row justify-between items-center w-[375px] px-[20px] py-[10px]'>
    <i data-name='nav-back' class='fas fa-chevron-left text-[22px] text-[#1A1A1A] shrink-0'></i>
    <span data-name='nav-title' class='flex-1 text-[18px] leading-[24px] font-[700] text-[#1A1A1A] text-center'>帮助与反馈</span>
    <div data-name='nav-spacer' class='w-[22px] shrink-0'></div>
  </div>
  <div data-name='faq-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='faq-card' class='flex flex-col justify-start items-stretch w-[335px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)]'>
      <div data-name='faq-header' class='flex flex-row justify-between items-center w-[335px] px-[16px] pt-[16px] pb-[12px]'>
        <span data-name='faq-title' class='text-[15px] leading-[20px] font-[700] text-[#1A1A1A] text-left'>常见问题</span>
      </div>
      <div data-name='faq-item-1' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='faq-1-text' class='flex-1 text-[14px] leading-[20px] font-[400] text-[#1A1A1A] text-left'>如何修改每日卡路里目标？</span>
        <i data-name='faq-1-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC] shrink-0'></i>
      </div>
      <div data-name='faq-divider-1' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='faq-item-2' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='faq-2-text' class='flex-1 text-[14px] leading-[20px] font-[400] text-[#1A1A1A] text-left'>拍照识别不准怎么办？</span>
        <i data-name='faq-2-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC] shrink-0'></i>
      </div>
      <div data-name='faq-divider-2' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='faq-item-3' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='faq-3-text' class='flex-1 text-[14px] leading-[20px] font-[400] text-[#1A1A1A] text-left'>如何导出我的健康数据？</span>
        <i data-name='faq-3-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC] shrink-0'></i>
      </div>
      <div data-name='faq-divider-3' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='faq-item-4' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='faq-4-text' class='flex-1 text-[14px] leading-[20px] font-[400] text-[#1A1A1A] text-left'>更换手机后数据会丢失吗？</span>
        <i data-name='faq-4-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC] shrink-0'></i>
      </div>
      <div data-name='faq-divider-4' class='w-[303px] h-[1px] bg-[#EEF0F2] self-center'></div>
      <div data-name='faq-more' class='flex flex-row justify-center items-center w-[335px] px-[16px] py-[14px]'>
        <span data-name='faq-more-text' class='text-[14px] leading-[20px] font-[600] text-[#22A85A] text-center'>查看全部问题</span>
      </div>
    </div>
  </div>
  <div data-name='feedback-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[8px]'>
    <div data-name='feedback-card' class='flex flex-col justify-start items-stretch w-[335px] px-[16px] py-[16px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)] gap-[12px]'>
      <span data-name='feedback-title' class='text-[15px] leading-[20px] font-[700] text-[#1A1A1A] text-left'>意见反馈</span>
      <div data-name='feedback-input' class='flex flex-col justify-start items-stretch w-[303px] h-[96px] px-[12px] py-[10px] bg-[#F7F8FA] rounded-[12px]'>
        <span data-name='feedback-placeholder' class='text-[13px] leading-[18px] font-[400] text-[#C0C4CC] text-left'>请描述你遇到的问题或建议（选填）</span>
      </div>
      <div data-name='feedback-contact' class='flex flex-row justify-between items-center w-[303px] px-[12px] h-[44px] bg-[#F7F8FA] rounded-[12px]'>
        <span data-name='feedback-contact-label' class='text-[13px] leading-[18px] font-[400] text-[#9CA3AF] text-left'>联系方式</span>
        <span data-name='feedback-contact-value' class='text-[13px] leading-[18px] font-[500] text-[#1A1A1A] text-right'>微信号 / 手机号（选填）</span>
      </div>
      <div data-name='feedback-submit' class='flex flex-row justify-center items-center w-[303px] h-[44px] rounded-[14px] bg-[#34C759]'>
        <span data-name='feedback-submit-text' class='text-[15px] leading-[20px] font-[700] text-[#FFFFFF] text-center'>提交反馈</span>
      </div>
    </div>
  </div>
  <div data-name='contact-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[16px]'>
    <div data-name='contact-card' class='flex flex-row justify-start items-center gap-[12px] w-[335px] px-[16px] py-[14px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)]'>
      <div data-name='contact-icon-wrap' class='flex flex-row justify-center items-center w-[36px] h-[36px] rounded-[10px] bg-[#E6F4FF] shrink-0'>
        <i data-name='contact-icon' class='fas fa-headset text-[16px] text-[#1677FF]'></i>
      </div>
      <div data-name='contact-info' class='flex flex-col justify-center items-start flex-1 gap-[2px]'>
        <span data-name='contact-title' class='text-[14px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>联系客服</span>
        <span data-name='contact-desc' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>工作日 9:00-18:00 在线</span>
      </div>
      <i data-name='contact-arrow' class='fas fa-chevron-right text-[12px] text-[#C0C4CC] shrink-0'></i>
    </div>
  </div>
</main>

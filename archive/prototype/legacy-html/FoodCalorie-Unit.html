<main data-name='FoodCalorie-Unit' class='flex flex-col justify-start items-stretch w-[375px] min-h-[812px] bg-[#F7F8FA]'>
  <div data-name='status-bar' class='flex flex-row justify-between items-center w-[375px] px-[20px] pt-[12px] pb-[8px]'>
    <span data-name='status-time' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>9:41</span>
    <div data-name='status-icons' class='flex flex-row justify-end items-center gap-[6px]'>
      <i data-name='icon-signal' class='fas fa-signal text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-wifi' class='fas fa-wifi text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-battery' class='fas fa-battery-full text-[14px] text-[#1A1A1A]'></i>
    </div>
  </div>
  <div data-name='top-nav' class='flex flex-row justify-between items-center w-[375px] px-[20px] py-[10px]'>
    <i data-name='nav-back' class='fas fa-chevron-left text-[22px] text-[#1A1A1A] shrink-0'></i>
    <span data-name='nav-title' class='flex-1 text-[18px] leading-[24px] font-[700] text-[#1A1A1A] text-center'>单位设置</span>
    <div data-name='nav-spacer' class='w-[22px] shrink-0'></div>
  </div>
  <div data-name='calorie-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='calorie-card' class='flex flex-col justify-start items-stretch w-[335px] px-[16px] py-[16px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)] gap-[12px]'>
      <span data-name='calorie-title' class='text-[15px] leading-[20px] font-[700] text-[#1A1A1A] text-left'>热量单位</span>
      <div data-name='calorie-opt-1' class='flex flex-row justify-between items-center w-[303px] px-[14px] h-[48px] rounded-[12px] bg-[#E8F5EC]'>
        <div data-name='calorie-opt-1-left' class='flex flex-row justify-start items-center gap-[10px]'>
          <i data-name='calorie-opt-1-icon' class='fas fa-fire text-[16px] text-[#22A85A]'></i>
          <span data-name='calorie-opt-1-text' class='text-[14px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>千卡（kcal）</span>
        </div>
        <i data-name='calorie-opt-1-check' class='fas fa-circle-check text-[20px] text-[#34C759]'></i>
      </div>
      <div data-name='calorie-opt-2' class='flex flex-row justify-between items-center w-[303px] px-[14px] h-[48px] rounded-[12px] bg-[#F7F8FA]'>
        <div data-name='calorie-opt-2-left' class='flex flex-row justify-start items-center gap-[10px]'>
          <i data-name='calorie-opt-2-icon' class='fas fa-temperature-quarter text-[16px] text-[#9CA3AF]'></i>
          <span data-name='calorie-opt-2-text' class='text-[14px] leading-[20px] font-[500] text-[#1A1A1A] text-left'>千焦（kJ）</span>
        </div>
        <i data-name='calorie-opt-2-check' class='fas fa-circle text-[20px] text-[#D9DEE3]'></i>
      </div>
      <span data-name='calorie-note' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>1 kcal ≈ 4.184 kJ</span>
    </div>
  </div>
  <div data-name='weight-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[8px]'>
    <div data-name='weight-card' class='flex flex-col justify-start items-stretch w-[335px] px-[16px] py-[16px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)] gap-[12px]'>
      <span data-name='weight-title' class='text-[15px] leading-[20px] font-[700] text-[#1A1A1A] text-left'>重量单位</span>
      <div data-name='weight-opt-1' class='flex flex-row justify-between items-center w-[303px] px-[14px] h-[48px] rounded-[12px] bg-[#E8F5EC]'>
        <div data-name='weight-opt-1-left' class='flex flex-row justify-start items-center gap-[10px]'>
          <i data-name='weight-opt-1-icon' class='fas fa-weight-hanging text-[16px] text-[#22A85A]'></i>
          <span data-name='weight-opt-1-text' class='text-[14px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>克（g）</span>
        </div>
        <i data-name='weight-opt-1-check' class='fas fa-circle-check text-[20px] text-[#34C759]'></i>
      </div>
      <div data-name='weight-opt-2' class='flex flex-row justify-between items-center w-[303px] px-[14px] h-[48px] rounded-[12px] bg-[#F7F8FA]'>
        <div data-name='weight-opt-2-left' class='flex flex-row justify-start items-center gap-[10px]'>
          <i data-name='weight-opt-2-icon' class='fas fa-weight-scale text-[16px] text-[#9CA3AF]'></i>
          <span data-name='weight-opt-2-text' class='text-[14px] leading-[20px] font-[500] text-[#1A1A1A] text-left'>盎司（oz）</span>
        </div>
        <i data-name='weight-opt-2-check' class='fas fa-circle text-[20px] text-[#D9DEE3]'></i>
      </div>
      <span data-name='weight-note' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>用于食物份量与体重记录显示</span>
    </div>
  </div>
  <div data-name='save-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[12px] pb-[24px]'>
    <div data-name='save-btn' class='flex flex-row justify-center items-center w-[335px] h-[48px] rounded-[16px] bg-[#34C759]'>
      <span data-name='save-btn-text' class='text-[16px] leading-[22px] font-[700] text-[#FFFFFF] text-center'>保存设置</span>
    </div>
  </div>
</main>

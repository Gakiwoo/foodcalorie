<main data-name='FoodCalorie-Burst' class='flex flex-col justify-start items-stretch w-[375px] min-h-[812px] bg-[#F7F8FA]'>
  <div data-name='status-bar' class='flex flex-row justify-between items-center w-[375px] px-[20px] pt-[12px] pb-[8px]'>
    <span data-name='status-time' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>9:41</span>
    <div data-name='status-icons' class='flex flex-row justify-end items-center gap-[6px]'>
      <i data-name='icon-signal' class='fas fa-signal text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-wifi' class='fas fa-wifi text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-battery' class='fas fa-battery-full text-[14px] text-[#1A1A1A]'></i>
    </div>
  </div>
  <div data-name='top-nav' class='flex flex-row justify-between items-center w-[375px] px-[20px] py-[10px]'>
    <i data-name='nav-back' class='fas fa-chevron-left text-[22px] text-[#1A1A1A] shrink-0'></i>
    <span data-name='nav-title' class='flex-1 text-[18px] leading-[24px] font-[700] text-[#1A1A1A] text-center'>连拍模式</span>
    <div data-name='nav-spacer' class='w-[22px] shrink-0'></div>
  </div>
  <div data-name='switch-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='switch-card' class='flex flex-row justify-between items-center w-[335px] px-[16px] py-[14px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)]'>
      <div data-name='switch-left' class='flex flex-row justify-start items-center gap-[12px] flex-1'>
        <div data-name='switch-icon-wrap' class='flex flex-row justify-center items-center w-[36px] h-[36px] rounded-[10px] bg-[#E8F5EC] shrink-0'>
          <i data-name='switch-icon' class='fas fa-camera text-[16px] text-[#22A85A]'></i>
        </div>
        <div data-name='switch-info' class='flex flex-col justify-center items-start flex-1 gap-[2px]'>
          <span data-name='switch-title' class='text-[14px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>启用连拍</span>
          <span data-name='switch-desc' class='text-[11px] leading-[15px] font-[400] text-[#9CA3AF] text-left'>拍照时连续拍摄多张，自动取最佳</span>
        </div>
      </div>
      <div data-name='switch-toggle' class='flex flex-row justify-center items-center w-[40px] h-[24px] rounded-[12px] bg-[#34C759] shrink-0'>
        <div data-name='switch-knob' class='w-[20px] h-[20px] rounded-[10px] bg-[#FFFFFF] shrink-0'></div>
      </div>
    </div>
  </div>
  <div data-name='count-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[8px] pb-[8px]'>
    <div data-name='count-card' class='flex flex-col justify-start items-stretch w-[335px] px-[16px] py-[16px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)] gap-[12px]'>
      <span data-name='count-title' class='text-[15px] leading-[20px] font-[700] text-[#1A1A1A] text-left'>连拍张数</span>
      <div data-name='count-row' class='flex flex-row justify-start items-center gap-[10px]'>
        <div data-name='count-2' class='flex flex-1 flex-row justify-center items-center h-[44px] rounded-[12px] bg-[#F7F8FA]'>
          <span data-name='count-2-text' class='text-[14px] leading-[20px] font-[500] text-[#9CA3AF] text-center'>2 张</span>
        </div>
        <div data-name='count-3' class='flex flex-1 flex-row justify-center items-center h-[44px] rounded-[12px] bg-[#34C759]'>
          <span data-name='count-3-text' class='text-[14px] leading-[20px] font-[600] text-[#FFFFFF] text-center'>3 张</span>
        </div>
        <div data-name='count-5' class='flex flex-1 flex-row justify-center items-center h-[44px] rounded-[12px] bg-[#F7F8FA]'>
          <span data-name='count-5-text' class='text-[14px] leading-[20px] font-[500] text-[#9CA3AF] text-center'>5 张</span>
        </div>
      </div>
    </div>
  </div>
  <div data-name='note-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='note-card' class='flex flex-col justify-start items-stretch w-[335px] px-[14px] py-[12px] bg-[#FFF7E6] rounded-[12px] gap-[6px]'>
      <div data-name='note-row-1' class='flex flex-row justify-start items-start gap-[8px]'>
        <i data-name='note-icon-1' class='fas fa-circle-info text-[14px] text-[#FA8C16] shrink-0 mt-[2px]'></i>
        <span data-name='note-text-1' class='flex-1 text-[12px] leading-[17px] font-[400] text-[#B26A00] text-left'>连拍会占用更多存储空间，建议仅在食物摆盘复杂时开启。</span>
      </div>
      <div data-name='note-row-2' class='flex flex-row justify-start items-start gap-[8px]'>
        <i data-name='note-icon-2' class='fas fa-circle-info text-[14px] text-[#FA8C16] shrink-0 mt-[2px]'></i>
        <span data-name='note-text-2' class='flex-1 text-[12px] leading-[17px] font-[400] text-[#B26A00] text-left'>开启后将自动在「识别结果」中选择清晰度最高的一张。</span>
      </div>
    </div>
  </div>
  <div data-name='save-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[12px] pb-[24px]'>
    <div data-name='save-btn' class='flex flex-row justify-center items-center w-[335px] h-[48px] rounded-[16px] bg-[#34C759]'>
      <span data-name='save-btn-text' class='text-[16px] leading-[22px] font-[700] text-[#FFFFFF] text-center'>保存设置</span>
    </div>
  </div>
</main>

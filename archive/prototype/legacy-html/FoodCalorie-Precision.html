<main data-name='FoodCalorie-Precision' class='flex flex-col justify-start items-stretch w-[375px] min-h-[812px] bg-[#F7F8FA]'>
  <div data-name='status-bar' class='flex flex-row justify-between items-center w-[375px] px-[20px] pt-[12px] pb-[8px]'>
    <span data-name='status-time' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>9:41</span>
    <div data-name='status-icons' class='flex flex-row justify-end items-center gap-[6px]'>
      <i data-name='icon-signal' class='fas fa-signal text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-wifi' class='fas fa-wifi text-[14px] text-[#1A1A1A]'></i>
      <i data-name='icon-battery' class='fas fa-battery-full text-[14px] text-[#1A1A1A]'></i>
    </div>
  </div>
  <div data-name='top-nav' class='flex flex-row justify-between items-center w-[375px] px-[20px] py-[10px]'>
    <i data-name='nav-back' class='fas fa-chevron-left text-[22px] text-[#1A1A1A] shrink-0'></i>
    <span data-name='nav-title' class='flex-1 text-[18px] leading-[24px] font-[700] text-[#1A1A1A] text-center'>拍照识别精度</span>
    <div data-name='nav-spacer' class='w-[22px] shrink-0'></div>
  </div>
  <div data-name='precision-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px] gap-[10px]'>
    <div data-name='mode-fast' class='flex flex-row justify-start items-center gap-[12px] w-[335px] px-[16px] py-[14px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)]'>
      <div data-name='mode-fast-icon-wrap' class='flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[12px] bg-[#F7F8FA] shrink-0'>
        <i data-name='mode-fast-icon' class='fas fa-gauge-high text-[18px] text-[#9CA3AF]'></i>
      </div>
      <div data-name='mode-fast-info' class='flex flex-col justify-center items-start flex-1 gap-[2px]'>
        <span data-name='mode-fast-name' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>快速</span>
        <span data-name='mode-fast-desc' class='text-[12px] leading-[16px] font-[400] text-[#9CA3AF] text-left'>约 1 秒，识别常见食物，省电</span>
      </div>
      <i data-name='mode-fast-check' class='fas fa-circle text-[20px] text-[#D9DEE3] shrink-0'></i>
    </div>
    <div data-name='mode-standard' class='flex flex-row justify-start items-center gap-[12px] w-[335px] px-[16px] py-[14px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)]'>
      <div data-name='mode-standard-icon-wrap' class='flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[12px] bg-[#E8F5EC] shrink-0'>
        <i data-name='mode-standard-icon' class='fas fa-scale-balanced text-[18px] text-[#22A85A]'></i>
      </div>
      <div data-name='mode-standard-info' class='flex flex-col justify-center items-start flex-1 gap-[2px]'>
        <span data-name='mode-standard-name' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>标准</span>
        <span data-name='mode-standard-desc' class='text-[12px] leading-[16px] font-[400] text-[#9CA3AF] text-left'>约 2 秒，识别准确均衡（当前）</span>
      </div>
      <i data-name='mode-standard-check' class='fas fa-circle-check text-[20px] text-[#34C759] shrink-0'></i>
    </div>
    <div data-name='mode-precise' class='flex flex-row justify-start items-center gap-[12px] w-[335px] px-[16px] py-[14px] bg-[#FFFFFF] rounded-[16px] shadow-[0px_4px_14px_0px_rgba(0,0,0,0.05)]'>
      <div data-name='mode-precise-icon-wrap' class='flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[12px] bg-[#F7F8FA] shrink-0'>
        <i data-name='mode-precise-icon' class='fas fa-magnifying-glass-plus text-[18px] text-[#9CA3AF]'></i>
      </div>
      <div data-name='mode-precise-info' class='flex flex-col justify-center items-start flex-1 gap-[2px]'>
        <span data-name='mode-precise-name' class='text-[15px] leading-[20px] font-[600] text-[#1A1A1A] text-left'>精准</span>
        <span data-name='mode-precise-desc' class='text-[12px] leading-[16px] font-[400] text-[#9CA3AF] text-left'>约 4 秒，识别细分类目，最准确</span>
      </div>
      <i data-name='mode-precise-check' class='fas fa-circle text-[20px] text-[#D9DEE3] shrink-0'></i>
    </div>
  </div>
  <div data-name='note-card' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[4px] pb-[8px]'>
    <div data-name='note-inner' class='flex flex-row justify-start items-start gap-[8px] w-[335px] px-[14px] py-[12px] bg-[#FFF7E6] rounded-[12px]'>
      <i data-name='note-icon' class='fas fa-circle-info text-[14px] text-[#FA8C16] shrink-0 mt-[2px]'></i>
      <span data-name='note-text' class='flex-1 text-[12px] leading-[17px] font-[400] text-[#B26A00] text-left'>精度越高耗时越长、耗电越多。日常记录建议使用「标准」模式。</span>
    </div>
  </div>
  <div data-name='save-section' class='flex flex-col justify-start items-stretch w-[375px] px-[20px] pt-[12px] pb-[24px]'>
    <div data-name='save-btn' class='flex flex-row justify-center items-center w-[335px] h-[48px] rounded-[16px] bg-[#34C759]'>
      <span data-name='save-btn-text' class='text-[16px] leading-[22px] font-[700] text-[#FFFFFF] text-center'>保存设置</span>
    </div>
  </div>
</main>

  .screen{position:absolute;inset:0;display:none;overflow-y:auto;}
  .screen.active{display:block;}
  .screen::-webkit-scrollbar{width:0;}

  .crumb{font-size:11px;color:#9ca3af;}

ne-height: 15px\">\n          8.5k 粉丝 · 2 天前 · 阅读 5 分钟\n        </span>\n      </div>\n      <div\n        data-node-id=\"12:16076\"\n        data-name=\"follow-btn\"\n        style=\"height: 28px; display: flex; flex-shrink: 0; justify-content: center; align-items: center; padding-right: 12px; padding-left: 12px; background: #E8F5EC; border-radius: 14px\">\n        <span\n          data-node-id=\"12:16080\"\n          data-name=\"follow-btn-text\"\n          style=\"color: #22A85A; font-size: 12px; font-family: Inter; text-align: center; font-weight: 600; line-height: 16px\">\n          关注\n        </span>\n      </div>\n    </div>\n  </div>\n  <div\n    data-node-id=\"12:16117\"\n    data-name=\"article-body\"\n    style=\"width: 375px; display: flex; flex: none; justify-content: flex-start; align-items: flex-start; flex-direction: column; gap: 12px; padding-top: 8px; padding-bottom: 12px; padding-right: 20px; padding-left: 20px\">\n    <p\n      data-node-id=\"12:16119\"\n      data-name=\"article-title\"\n      style=\"align-self: stretch; color: #1A1A1A; font-size: 22px; font-family: Inter; font-weight: 700; line-height: 30px\">\n      减脂期也能吃的 5 道高蛋白晚餐\n    </p>\n    <p\n      data-node-id=\"12:16173\"\n      data-name=\"article-para-1\"\n      style=\"align-self: stretch; color: #3A3A3A; font-size: 15px; font-family: Inter; line-height: 24px\">\n      减脂不等于挨饿。合理搭配高蛋白、低 GI\n      的食材，既能保持饱腹感，又能稳定血糖，让减脂变得更轻松。今天营养师 Maya\n      教你 5 道简单快手晚餐，每道都控制在 400 kcal 以内，蛋白质含量超过 25g。\n    </p>\n    <p\n      data-node-id=\"12:16386\"\n      data-name=\"article-para-2\"\n      style=\"align-self: stretch; color: #3A3A3A; font-size: 15px; font-family: Inter; line-height: 24px\">\n      推荐食材清单：鸡胸肉 150g、虾仁 100g、豆腐 200g、西兰花 100g、糙米\n      80g。这些都是低脂高蛋白的代表，热量密度低但饱腹感强。\n    </p>\n    <p\n      data-node-id=\"12:16547\"\n      data-name=\"article-para-3\"\n      style=\"align-self: stretch; color: #3A3A3A; font-size: 15px; font-family: Inter; line-height: 24px\">\n      烹饪建议：少油少盐，使用不粘锅或蒸煮方式，搭配柠檬汁、黑胡椒、香草调味。避免重油糖醋类做法，让食材本味发挥出来。\n    </p>\n  </div>\n  <div\n    data-node-id=\"12:16708\"\n    data-name=\"related-section\"\n    style=\"width: 375px; display: flex; flex: none; justify-content: flex-start; align-items: flex-start; flex-direction: column; gap: 10px; padding-top: 8px; padding-bottom: 8px; padding-right: 20px; padding-left: 20px\">\n    <div\n      data-node-id=\"12:16710\"\n      data-name=\"related-divider\"\n      style=\"width: 335px; height: 1px; display: flex; flex: none; justify-content: flex-start; align-items: flex-start; flex-direction: column; background: #EEF0F2\"></div>\n    <span\n      data-node-id=\"12:16714\"\n      data-name=\"related-title\"\n      style=\"color: #1A1A1A; font-size: 14px; font-family: Inter; font-weight: 700; line-height: 20px\">\n      相关推荐\n    </span>\n    <div\n      data-node-id=\"12:16753\"\n      data-name=\"related-card-1\"\n      style=\"width: 335px; display: flex; flex: none; justify-content: flex-start; align-items: center; gap: 10px; padding: 10px; background: #FFFFFF; border-radius: 12px; box-shadow: 0px 2px 8px 0px rgba(0,0,0,0.04)\">\n      <div\n        data-node-id=\"12:16759\"\n        data-name=\"related-thumb-1\"\n        style=\"width: 56px; height: 56px; display: flex; flex: none; justify-content: center; align-items: center; background: linear-gradient(135deg, #FFE0B2 0%, #FFCC80 100%); border-radius: 8px\">\n        <img\n          src=\"./asset/icons/svg_272563f0.svg\"\n          data-node-id=\"12:15368\"\n          data-name=\"related-icon-1\"\n          style=\"width: 22px; height: 22px; color: #FFFFFF\" />\n      </div>\n      <div\n        data-node-id=\"12:16767\"\n        data-name=\"related-info-1\"\n        style=\"display: flex; flex: 1; justify-content: center; align-items: flex-start; flex-direction: column; gap: 2px\">\n        <span\n          data-node-id=\"12:16769\"\n          data-name=\"related-name-1\"\n          style=\"flex-shrink: 0; color: #1A1A1A; font- var order = Object.keys(SCREENS);
var stack = [];
var current = "home";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function render(){
  var ps = document.getElementById("phoneScreen");
  ps.innerHTML = "";
  order.forEach(function(key){
    var d = document.createElement("div");
    d.className = "screen" + (key===current ? " active" : "");
    d.id = "screen-" + key;
    d.innerHTML = SCREENS[key].body;
    ps.appendChild(d);
  });
  bindNav();
  document.getElementById("crumb").textContent = "当前页：" + SCREENS[current].label;
}

function go(key, push){
  if(!SCREENS[key]) return;
  if(push!==false){ stack.push(current); }
  current = key;
  var els = document.querySelectorAll(".screen");
  for(var i=0;i<els.length;i++){ els[i].classList.remove("active"); }
  var t = document.getElementById("screen-"+key);
  if(t){ t.classList.add("active"); t.scrollTop = 0; }
  document.getElementById("crumb").textContent = "当前页：" + SCREENS[key].label;
}

function historyBack(){
  if(stack.length===0){ go("home",false); return; }
  var prev = stack.pop();
  go(prev, false);
}

function resetProto(){ stack=[]; go("home",false); }

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}

function bindNav(){
  order.forEach(function(key){
    var page = document.getElementById("screen-"+key);
    if(!page || !NAV[key]) return;
    NAV[key].forEach(function(item){
      var sel = item[0], target = item[1];
      var els = page.querySelectorAll(sel);
      for(var i=0;i<els.length;i++){
        els[i].style.cursor = "pointer";
        els[i].addEventListener("click", function(e){
          e.stopPropagation();
          if(target===""){ historyBack(); }
          else if(SCREENS[target]){ go(target); }
        });
      }
    });
  });
}

// build jump panel
(function(){
  var j = document.getElementById("jump");
  order.forEach(function(key){
    var b = document.createElement("button");
    b.textContent = SCREENS[key].label;
    b.onclick = function(){ go(key); };
    j.appendChild(b);
  });
})();

render();
</script>
